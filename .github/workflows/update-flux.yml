name: update-flux

on:
  workflow_dispatch:
  schedule:
    # Every monday at 4:00 AM
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: write
  pull-requests: write

jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2  # v2.9.5

      - name: Check for updates
        id: update
        run: |
          flux install \
            --export > ./clusters/my-cluster/flux-system/gotk-components.yaml

          VERSION="$(flux -v)"
          echo "flux_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: update-flux
          commit-message: "chore(flux): update to ${{ steps.update.outputs.flux_version }}"
          title: "chore(flux): update to ${{ steps.update.outputs.flux_version }}"
          body: |
            Automatic update of Flux CD components (source-controller, kustomize-controller, helm-controller, notification-controller).

            Version : ${{ steps.update.outputs.flux_version }}

            Generated via `flux install --export`.
          labels: |
            flux
            dependencies
