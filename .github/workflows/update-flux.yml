name: update-flux

on:
  workflow_dispatch:
  schedule:
    # Every monday at 4:00 AM
    - cron: "0 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Check for updates
        id: update
        run: |
          flux install \
            --export > ./clusters/my-cluster/flux-system/gotk-components.yaml

          VERSION="$(flux -v)"
          echo "flux_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-flux
          commit-message: "chore(flux): update to ${{ steps.update.outputs.flux_version }}"
          title: "chore(flux): update to ${{ steps.update.outputs.flux_version }}"
          body: |
            Automatic update of Flux CD components (source-controller, kustomize-controller, helm-controller, notification-controller).

            Version : ${{ steps.update.outputs.flux_version }}

            Generated via `flux install --export`.
          labels: |
            flux
            dependencies