# Weekly re-scan of the entire git history for secrets.
#
# The secret-scan job in build.yml already walks the full history on every push
# and pull request, so this is not about catching new commits. It is about
# catching OLD ones with NEW rules: gitleaks ships new detection patterns
# regularly, and a secret its 8.30 rules do not recognise may well be recognised
# six months from now. Nothing else would ever re-examine a commit from last year.
#
# That only works if gitleaks itself gets updated, which is why GITLEAKS_VERSION
# in build.yml now carries a `# renovate:` annotation. Without it this job would
# re-run the same rules against the same history forever and find the same
# nothing.
name: secret-scan-history

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 5:00 AM, after the Flux update job at 4:00
    - cron: "0 5 * * 1"

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  scan:
    name: Scan full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Version deliberately NOT pinned to the one in build.yml: this job exists to
      # apply the newest rules to the oldest commits, so it takes whatever the
      # latest release is at the time it runs.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep -m1 '"tag_name"' | cut -d'"' -f4 | sed 's/^v//')
          echo "scanning with gitleaks ${version}"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          sha256sum -c <(grep "linux_x64.tar.gz" "gitleaks_${version}_checksums.txt")
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks

      - name: Run gitleaks over every commit
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact -v --log-opts="--all"
