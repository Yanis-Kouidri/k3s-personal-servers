# TEMPORARY workaround: containers cannot signal their own processes on kernel 7.0.0-42.
#
# Install to /etc/sysctl.d/20-apparmor.conf (overrides /usr/lib/sysctl.d/10-apparmor.conf),
# then: sudo sysctl --system, and restart the pods that were started before.
#
# Since the node booted 7.0.0-42 (2026-11-04), restrict_unprivileged_unconfined turns
# runc's profile change into a stack: every container process runs as
# cri-containerd.apparmor.d//&unconfined, which the containerd profile does not accept as
# a signal peer. Postgres cannot signal its own backends and never starts, which takes
# authentik, immich, n8n and sonarqube down with it.
#
# This weakens Ubuntu's hardening (unconfined processes may again change profile freely).
# REMOVE IT once k3s ships a containerd with the stacked-peer rules
# (containerd/containerd#14487, tracked by k3s-io/k3s#13625): delete the file,
# sudo sysctl --system, restart the pods.

kernel.apparmor_restrict_unprivileged_unconfined = 0
