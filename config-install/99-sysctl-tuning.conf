# Kernel tuning for the k3s node.
#
# Install to /etc/sysctl.d/99-sysctl-tuning.conf, then: sudo sysctl --system
# BBR also needs config-install/tcp-bbr.conf (module) and the fq qdisc on ens3
# (config-install/10-netplan-ens3-fq.conf), see those files.

# inotify: the limit is per user and nearly every container process runs as root.
# On 2026-09-30 root held ~119 of the default 128 instances, one new watcher away
# from "too many open files" in the kubelet, containerd or `kubectl logs -f`.
# These are ceilings: memory is only used by watches actually created.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288

# TCP BBR instead of cubic: models bandwidth and RTT instead of backing off on every
# lost packet, which helps clients on mobile or distant links (Immich, sites,
# WireGuard). Only affects traffic sent by this host, on new connections. Pod
# network namespaces copy this value when they are created, so running pods keep
# cubic until they restart.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
