# fq qdisc on ens3, paired with TCP BBR (config-install/99-sysctl-tuning.conf).
#
# net.core.default_qdisc does not reach ens3: the link is brought up before
# systemd-sysctl runs, so it kept pfifo_fast. This drop-in extends the .network
# file netplan generates for ens3 so systemd-networkd sets fq when it configures it.
#
# Install to /etc/systemd/network/10-netplan-ens3.network.d/fq.conf
# It takes effect at the next boot; until then: sudo tc qdisc replace dev ens3 root fq
[FairQueueing]
Parent=root
