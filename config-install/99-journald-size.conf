# Cap the systemd journal size.
#
# journald had no limit and defaults to 10% of the filesystem (capped at 4G): it
# held 3.9G on 2026-09-30, mostly kernel AppArmor audit lines ("change_onexec ...
# cri-containerd.apparmor.d") logged on every container exec. Pod logs are kept
# by the kubelet under /var/log/pods, so the journal only needs host history.
#
# Install to /etc/systemd/journald.conf.d/99-journald-size.conf, then:
#   sudo systemctl restart systemd-journald
# The restart applies the cap and deletes the oldest archived journals.
[Journal]
SystemMaxUse=1G
SystemKeepFree=10G
