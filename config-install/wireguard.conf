# Load WireGuard on the host before k3s starts the VPN pod.
# Install to /etc/modules-load.d/wireguard.conf
#
# The WireGuard pod must create and configure wg0 in its own network namespace,
# so it retains CAP_NET_ADMIN.  It must never load or write host kernel modules:
# keeping the module loaded here lets the pod run with no /lib/modules hostPath.
wireguard
