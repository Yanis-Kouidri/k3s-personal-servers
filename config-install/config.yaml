# This file must be copy and placed in : /etc/rancher/k3s/config.yaml

disable:
  - traefik

# Configure Kubeconfig permissions upon generation
write-kubeconfig-mode: "0600"

# Encrypt Secret objects in the datastore (state.db). The key is generated in
# /var/lib/rancher/k3s/server/cred/encryption-config.json, on the same disk, so this
# protects a leaked copy of the database, not a root user on the node.
# On a node installed without it, follow "Secrets encryption at rest" in SERVER_CONFIG.md.
secrets-encryption: true

# Native Dual-Stack IPv4/IPv6 configuration
cluster-cidr: "10.42.0.0/16,2001:db8:42::/64"
service-cidr: "10.43.0.0/16,2001:db8:43::/112"

flannel-ipv6-masq: true

kubelet-arg:
  - "config=/etc/rancher/k3s/kubelet-config.yaml"
