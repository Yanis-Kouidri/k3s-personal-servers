apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-server
  namespace: minecraft
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate  # Use to avoid to have 2 minecraft server pods simutanniously
  selector:
    matchLabels:
      app: minecraft-server
  template:
    metadata:
      labels:
        app: minecraft-server
    spec:
      priorityClassName: background
      # None of this container's processes talk to the Kubernetes API, so the
      # ServiceAccount token has no reason to be mounted. Leaving it in place
      # hands a foothold to anything that manages to run code in here.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft-server
          image: itzg/minecraft-server:2026.9.0-java25
          # No `drop: ALL`: the image starts as root and uses su-exec to run the
          # server as 1000, which needs SETUID/SETGID.
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 25565
          envFrom:
            - configMapRef:
                name: minecraft-server-config
          volumeMounts:
            - mountPath: /data
              name: minecraft-data
          resources:
            requests:
              # MEMORY=2G in the ConfigMap is the JVM heap; the process sits around
              # 2.1Gi once overhead is counted, so 1Gi was never realistic.
              cpu: "250m"
              memory: "2560Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
          startupProbe:
            exec:
              command:
                - mc-monitor
                - status
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30  # 5 minutes max to start
          readinessProbe:
            exec:
              command:
                - mc-monitor
                - status
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - mc-monitor
                - status
            periodSeconds: 30
            failureThreshold: 3

      volumes:
        - name: minecraft-data
          persistentVolumeClaim:
            claimName: minecraft-pvc
