apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: wireguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
    spec:
      priorityClassName: application
      # None of this container's processes talk to the Kubernetes API, so the
      # ServiceAccount token has no reason to be mounted. Leaving it in place
      # hands a foothold to anything that manages to run code in here.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The image renders wg0.conf and the peer confs from /config/templates only
        # when wg0.conf is missing or one of its environment variables changed, and
        # never overwrites templates already on the volume. Install the templates
        # from Git and delete the file it stores the previous variables in, so they
        # all look changed and the confs are rendered again on every start: keys and
        # peer addresses are kept, they are read back from the volume.
        #
        # Do not delete wg0.conf instead: the image would then create it with the
        # default umask, world-readable with the server's private key in it. Rendered
        # over the existing file, it keeps its mode, which is reset to 0600 here.
        - name: install-templates
          image: linuxserver/wireguard:1.0.20260223
          command:
            - sh
            - -c
            - >-
              cp /templates/server.conf /templates/peer.conf /config/templates/ &&
              cp /templates/Corefile /config/coredns/Corefile &&
              rm -f /config/.donoteditthisfile &&
              if [ -f /config/wg_confs/wg0.conf ]; then
              chmod 600 /config/wg_confs/wg0.conf; fi
          securityContext:
            # Files on the config volume belong to PUID 1000.
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
            - name: templates
              mountPath: /templates
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: wireguard
          image: linuxserver/wireguard:1.0.20260223
          securityContext:
            # NET_ADMIN used to be added on top of the default capability set, so the
            # container kept everything it was given plus NET_ADMIN. Drop the lot
            # first, then add back only what is actually needed -- four instead of
            # the ~14 a container gets by default.
            #
            # DAC_OVERRIDE is not optional here, however tempting it looks: the
            # container runs as root, but every file on the config volume is owned by
            # uid 1000 with mode 0600 (wg0.conf) or 0700 (the peer directories).
            # Without DAC_OVERRIDE root cannot read its own configuration and the
            # tunnel never comes up. Verified both ways in a throwaway pod: with the
            # four capabilities below the files are readable, with NET_ADMIN alone
            # every read is refused.
            #
            # CHOWN and FOWNER are what the image's init uses to chown /config to
            # PUID; without them it starts anyway but logs a permission failure on
            # every boot.
            #
            # allowPrivilegeEscalation is deliberately left alone: this image's
            # s6-overlay init has not been tested under no_new_privs.
            capabilities:  # Add "SYS_MODULE" if necessary
              drop:
                - ALL
              add:
                - NET_ADMIN
                - DAC_OVERRIDE
                - CHOWN
                - FOWNER
          envFrom:
            - configMapRef:
                name: wireguard-config
          ports:
            - containerPort: 51820
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: modules
              mountPath: /lib/modules
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command: ["wg", "show", "all", "dump"]
            initialDelaySeconds: 30
            periodSeconds: 300
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "wg show ${SERVER_INTERFACE:-wg0} > /dev/null 2>&1"
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: wireguard-pvc
        - name: modules
          hostPath:
            path: /lib/modules
        - name: templates
          configMap:
            name: wireguard-templates
