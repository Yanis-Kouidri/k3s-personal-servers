apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-policy
  namespace: n8n
spec:
  podSelector:
    matchLabels:
      service: n8n
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 5678
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: n8n
          podSelector:
            matchLabels:
              service: postgres-n8n
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 192.168.0.0/16
              - 172.16.0.0/12
        - ipBlock:
            cidr: ::/0
            except:
              - 2001:db8:42::/64
              - 2001:db8:43::/112
              - fc00::/7
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 993   # IMAPS
        - protocol: TCP
          port: 465   # SMTPS
        - protocol: TCP
          port: 587   # SMTP Submission
    # The Health checker workflow calls our own sites (*.kouidri.fr). Those
    # resolve to the node's public IPs, which kube-proxy DNATs straight to the
    # Envoy proxy pod before the policy is evaluated, so the ipBlock rule above
    # (which excludes the pod CIDRs) refuses them. Allow the post-DNAT target.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/name: envoy
      ports:
        - protocol: TCP
          port: 10443
        - protocol: TCP
          port: 10080
