apiVersion: batch/v1
kind: CronJob
metadata:
  name: n8n-db-backup
  namespace: n8n
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  # A CronJob that misses more than 100 schedules (node down, cluster off for a few
  # days) stops scheduling altogether and never recovers on its own. This bounds how
  # far behind a missed run may start, so the counter never reaches that limit.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            service: postgres-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: postgres-backup
              image: postgres:18.6-alpine
              # Stays root: the backup PVC is root-owned, so dropping to another uid
              # would make the existing dumps unwritable. pg_dump needs no capability
              # at all, so the whole set goes.
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  DB_HOST=postgres-service
                  DATE="$(date +%Y-%m-%d_%H-%M-%S)"
                  BACKUP_FILE="/backups/n8n_db_${DATE}.dump"

                  # A dump that dies midway (DB restarting, disk full) still leaves a
                  # truncated file behind, which the rotation below would happily count
                  # as a valid backup. Drop it unless the script reaches the end.
                  trap 'rm -f "$BACKUP_FILE"' EXIT

                  # k3s programs a new pod's NetworkPolicy rules slightly after the pod
                  # gets its IP, so the very first connection out of a freshly created
                  # backup pod is refused ("connection to server at ... failed:
                  # Connection refused"). Without this wait the first attempt always
                  # fails and only the OnFailure restart succeeds.
                  i=0
                  until pg_isready -h "$DB_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -q; do
                    i=$((i + 1))
                    if [ "$i" -ge 30 ]; then
                      echo "PostgreSQL unreachable at $DB_HOST after 60s, giving up" >&2
                      exit 1
                    fi
                    echo "waiting for PostgreSQL at $DB_HOST..."
                    sleep 2
                  done

                  echo "Starting n8n PostgreSQL backup..."
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump \
                    -h "$DB_HOST" \
                    -U "$POSTGRES_USER" \
                    -d "$POSTGRES_DB" \
                    --format=custom \
                    --file="$BACKUP_FILE"

                  trap - EXIT

                  find /backups -type f -mtime +7 -name "*.dump" -delete
                  echo "Backup completed: $BACKUP_FILE"
              env:
                - name: POSTGRES_DB
                  value: n8n
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-n8n-pvc
