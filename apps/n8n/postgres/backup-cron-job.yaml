apiVersion: batch/v1
kind: CronJob
metadata:
  name: n8n-db-backup
  namespace: n8n
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  # A CronJob that misses more than 100 schedules (node down, cluster off for a few
  # days) stops scheduling altogether and never recovers on its own. This bounds how
  # far behind a missed run may start, so the counter never reaches that limit.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # A hung run (stuck connection, lock wait) would otherwise hold the Job
      # forever, and with concurrencyPolicy: Forbid block every later run without
      # failing, so no alert. Past the deadline the Job fails with DeadlineExceeded
      # and job-monitor reports it.
      # Normally under 20s. 15 min still covers the 60s DB wait, the OnFailure
      # retries (the deadline counts all of them) and a lot of database growth.
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            service: n8n-db-backup
        spec:
          priorityClassName: background
          # None of this container's processes talk to the Kubernetes API, so the
          # ServiceAccount token has no reason to be mounted. Leaving it in place
          # hands a foothold to anything that manages to run code in here.
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          # Non-root: the job only creates new dumps and deletes old ones. The backup
          # directory is world-writable (local-path creates it 0777, no sticky bit),
          # so uid 70 -- postgres in the alpine image -- can do both, including on
          # the dumps an earlier root run left behind.
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: postgres-backup
              image: postgres:18.6-alpine
              # pg_dump needs no capability at all, and writes nowhere but /backups.
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              # The script is shared by every app: apps/components/postgres-backup/backup.sh
              command:
                - /bin/sh
                - /scripts/backup.sh
              env:
                - name: DB_HOST
                  value: "postgres-service"
                - name: DUMP_PREFIX
                  value: "n8n"
                - name: DUMP_FORMAT
                  value: "custom"
                - name: POSTGRES_DB
                  value: n8n
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-n8n-pvc
            - name: scripts
              configMap:
                name: postgres-backup-scripts
