apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    service: postgres-n8n
  name: postgres
  namespace: n8n
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      service: postgres-n8n
  template:
    metadata:
      labels:
        service: postgres-n8n
    spec:
      priorityClassName: datastore
      # None of this container's processes talk to the Kubernetes API, so the
      # ServiceAccount token has no reason to be mounted. Leaving it in place
      # hands a foothold to anything that manages to run code in here.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - image: postgres:18.6
          name: postgres
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: "500m"
              memory: 752Mi
          # Same as the Immich database: the entrypoint needs its capabilities to
          # drop to the postgres user, so only privilege escalation is blocked here.
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          # pg_isready is in the image and returns 0 here without arguments or
          # credentials (checked in the pod). The liveness thresholds are deliberately
          # slack -- 6 failures 30s apart -- because restarting a database that is
          # merely busy or replaying WAL makes things worse, not better.
          startupProbe:
            exec:
              command: ["pg_isready", "-q"]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-q"]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-q"]
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 5
          volumeMounts:
            - name: postgresql-pvc
              mountPath: /var/lib/postgresql/data
            - name: init-data
              mountPath: /docker-entrypoint-initdb.d/init-n8n-user.sh
              subPath: init-data.sh
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: n8n
            - name: POSTGRES_NON_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_USER
            - name: POSTGRES_NON_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_PASSWORD
            - name: POSTGRES_HOST
              value: postgres-service
            - name: POSTGRES_PORT
              value: "5432"
      restartPolicy: Always
      volumes:
        - name: postgresql-pvc
          persistentVolumeClaim:
            claimName: postgresql-pvc
        - name: postgres-secret
          secret:
            secretName: postgres-secret
        - name: init-data
          configMap:
            name: init-data
            defaultMode: 0744
