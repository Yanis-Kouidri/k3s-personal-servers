apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-policy-temporary
  namespace: n8n
spec:
  podSelector:
    matchLabels:
      service: n8n
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 5678
  egress:
    - to: {}
      ports:
        - protocol: TCP
          port: 443