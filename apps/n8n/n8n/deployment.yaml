apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: n8n
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      service: n8n
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        service: n8n
    spec:
      priorityClassName: application
      # None of this container's processes talk to the Kubernetes API, so the
      # ServiceAccount token has no reason to be mounted. Leaving it in place
      # hands a foothold to anything that manages to run code in here.
      automountServiceAccountToken: false
      securityContext:
        # Replaces a busybox initContainer that ran as root purely to
        # `chown 1000:1000 /data`. The kubelet does the same job without a
        # privileged container, and OnRootMismatch means it only acts when the
        # volume's group is actually wrong -- here it already is 1000, so this is a
        # no-op at every start rather than a recursive chown. Same pattern as
        # bulwark.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - command:
            - /bin/sh
          args:
            - -c
            # The `sleep 5` that used to be here predates the startupProbe below,
            # which already gives n8n 5 minutes to come up. It cost 5 seconds on
            # every single restart for nothing.
            - n8n start
          env:
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: postgres-service.n8n.svc.cluster.local
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: n8n
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_PASSWORD
            # n8n encrypts stored credentials with this key. Left unset, it
            # generates one on first start and writes it to /home/node/.n8n/config
            # on the PVC -- so the key existed in exactly one place, inside the
            # volume it protects. Losing or restoring that PVC elsewhere made every
            # credential undecryptable, which the database dump could not help with.
            #
            # The value here IS the key n8n already generated, lifted out of that
            # config file, not a new one: a fresh key would have locked the existing
            # credentials out.
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: N8N_ENCRYPTION_KEY
            - name: N8N_PROTOCOL
              value: http
            - name: N8N_PORT
              value: "5678"
          image: n8nio/n8n:2.40.1
          # The tag is pinned and Renovate bumps it, so there is nothing to re-pull:
          # Always just meant a registry round-trip on every restart, and no restart
          # at all whenever Docker Hub was unreachable.
          imagePullPolicy: IfNotPresent
          name: n8n
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: 5678
            failureThreshold: 30
            periodSeconds: 10  # 5 minutes max to start (30 * 10s)

          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5

          ports:
            - containerPort: 5678
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - mountPath: /home/node/.n8n
              name: n8n-claim0
      restartPolicy: Always
      volumes:
        - name: n8n-claim0
          persistentVolumeClaim:
            claimName: n8n-claim0
