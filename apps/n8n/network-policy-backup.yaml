apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup-policy
  namespace: n8n
spec:
  podSelector:
    matchLabels:
      service: postgres-backup
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: n8n
          podSelector:
            matchLabels:
              service: postgres-n8n
      ports:
        - protocol: TCP
          port: 5432