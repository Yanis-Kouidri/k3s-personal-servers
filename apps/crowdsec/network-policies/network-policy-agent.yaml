apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-agent
  namespace: crowdsec
spec:
  podSelector:
    matchLabels:
      k8s-app: crowdsec
      type: agent
  ingress:
    - from:
        - podSelector:
            matchLabels:
              k8s-app: crowdsec
      ports:
        - protocol: TCP
          port: 6060
