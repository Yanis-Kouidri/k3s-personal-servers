apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-egress
  namespace: crowdsec
spec:
  podSelector: {}
  egress:
    - to:
        - podSelector:
            matchLabels:
              k8s-app: crowdsec
      ports:
        - protocol: TCP
          port: 6060
        - protocol: TCP
          port: 8080
