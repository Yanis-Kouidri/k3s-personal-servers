# for raw logs format: json or cri (docker|containerd)
container_runtime: containerd

agent:
  # Stays root: it reads /var/log/pods (root:root 0750) and /var/log/auth.log
  # (syslog:adm 0640) through the read-only hostPath, which is also why the
  # namespace has to stay `enforce: privileged`. What it does not need is any
  # capability: uid 0 reads root-owned files without CAP_DAC_OVERRIDE, and adm
  # (gid 4) covers auth.log. Checked on the node with this image and drop ALL.
  # The image puts root in adm already; supplementalGroups keeps it explicit.
  podSecurityContext:
    supplementalGroups:
      - 4
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop:
        - ALL
  wait_for_lapi:
    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
      capabilities:
        drop:
          - ALL
  # Detection stops if this goes, but existing bans stay in the host firewall,
  # so nothing becomes reachable that was not already.
  priorityClassName: application
  # The chart defaults to 500m/250Mi. Observed: 4m and 44Mi.
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi
  acquisition:
    # The namespace where the pod is located
    - namespace: envoy-gateway-system
      # The pod name
      podName: envoy-envoy-gateway-system-envoy-gateway-*
      # as in crowdsec configuration, we need to specify the program name to find a matching parser
      program: envoy
      poll_without_inotify: true
  additionalAcquisition:
    - source: file
      filenames:
        - /var/log/auth.log
      labels:
        type: syslog
  # Only include environment variables NOT already defined in the chart's template
  # (DISABLE_LOCAL_API, DISABLE_ONLINE_API, CROWDSEC_BYPASS_DB_VOLUME_CHECK, LOCAL_API_URL are hardcoded in chart)
  env:
    - name: COLLECTIONS
      value: "yanis-kouidri/envoy crowdsecurity/base-http-scenarios crowdsecurity/http-cve crowdsecurity/http-dos crowdsecurity/whitelist-good-actors crowdsecurity/linux"
    - name: PARSERS
      value: "crowdsecurity/cri-logs"

lapi:
  # Root as in the image (its PVCs are root-owned), but with no capability:
  # it only listens on 8080/6060 and writes files it owns.
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop:
        - ALL
  priorityClassName: application
  # The chart defaults to 500m/500Mi. Observed: 7m and 93Mi.
  resources:
    requests:
      cpu: 50m
      memory: 160Mi
    limits:
      cpu: 500m
      memory: 512Mi
  envFrom:
    - secretRef:
        name: crowdsec-secret
