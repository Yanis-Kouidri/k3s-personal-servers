apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crowdsec
resources:
  - namespace.yaml
  - helm-repository.yaml
  - secrets.enc.yaml
  - helm-release.yaml
  - network-policies/network-policy-default-deny.yaml
  - network-policies/network-policy-allow-dns.yaml
  - network-policies/network-policy-allow-egress-to-crowdsec-api.yaml
  - network-policies/network-policy-lapi.yaml
  - network-policies/network-policy-agent.yaml
  - network-policies/network-policy-allow-internal-egress.yaml
  - lapi-nodeport-service.yaml

# Values ConfigMaps for the HelmReleases. The name has no hash suffix (the HelmRelease's
# valuesFrom refers to it literally), so a change is not a new object: the watch label
# makes helm-controller react to it right away instead of at the next interval.
configMapGenerator:
  - name: crowdsec-values
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
