apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crowdsec
resources:
  - namespace.yaml
  - helmrepository.yaml
  - secrets.enc.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: crowdsec-values
    files:
      - values.yaml

generatorOptions:
  disableNameSuffixHash: true