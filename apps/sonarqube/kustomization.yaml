apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sonarqube

resources:
  - namespace.yaml
  - helm-repository.yaml
  - helm-release.yaml
  - postgres-helm-repository.yaml
  - postgres-helm-release.yaml
  - backup-pvc.yaml
  - backup-cron-job.yaml

configMapGenerator:
  - name: sonarqube-values
    files:
      - values.yaml=sonar-values.yaml
    options:
      disableNameSuffixHash: true
  - name: postgres-sonarqube-values
    files:
      - values.yaml=postgres-values.yaml
    options:
      disableNameSuffixHash: true
