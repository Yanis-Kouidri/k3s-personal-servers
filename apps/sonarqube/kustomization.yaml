apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sonarqube

resources:
  - namespace.yaml
  - secrets.enc.yaml
  - monitoring-passcode.enc.yaml
  - helm-repository.yaml
  - helm-release.yaml
  - postgres-helm-repository.yaml
  - postgres-helm-release.yaml
  - backup-pvc.yaml
  - backup-cron-job.yaml
  - restore-verify-cron-job.yaml
  # Network policies
  - network-policies/network-policy-default-deny.yaml
  - network-policies/network-policy-allow-dns.yaml
  - network-policies/network-policy-sonarqube.yaml
  - network-policies/network-policy-postgres.yaml
  - network-policies/network-policy-backup.yaml

# Values ConfigMaps for the HelmReleases. The name has no hash suffix (the HelmRelease's
# valuesFrom refers to it literally), so a change is not a new object: the watch label
# makes helm-controller react to it right away instead of at the next interval.
configMapGenerator:
  - name: sonarqube-values
    files:
      - values.yaml=sonar-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
  - name: postgres-sonarqube-values
    files:
      - values.yaml=postgres-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled

# Scripts of the *-db-backup and *-restore-verify CronJobs
components:
  - ../components/postgres-backup
