apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  interval: 5m
  chart:
    spec:
      chart: sonarqube
      version: "^2026.x.x"
      sourceRef:
        kind: HelmRepository
        name: sonarqube
        namespace: sonarqube
  # No version pinned: Flux always installs/upgrades to the latest chart version
  valuesFrom:
    - kind: ConfigMap
      name: sonarqube-values
      valuesKey: values.yaml