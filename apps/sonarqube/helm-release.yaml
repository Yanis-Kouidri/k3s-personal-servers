apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  interval: 5m
  chart:
    spec:
      chart: sonarqube
      version: "2026.4.1"
      sourceRef:
        kind: HelmRepository
        name: sonarqube
        namespace: sonarqube
  valuesFrom:
    - kind: ConfigMap
      name: sonarqube-values
      valuesKey: values.yaml
