apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  interval: 5m
  chart:
    spec:
      chart: sonarqube
      version: "2026.5.1006"
      sourceRef:
        kind: HelmRepository
        name: sonarqube
        namespace: sonarqube
  valuesFrom:
    - kind: ConfigMap
      name: sonarqube-values
      valuesKey: values.yaml
  # The chart's HTTPRoute has no sectionName option, so its parentRef attaches to
  # every listener of the Gateway, port 80 included. Its hostname is more specific
  # than the catch-all http-to-https redirect, so SonarQube (login form, tokens) was
  # served in clear text over HTTP and through the onion service instead of being
  # redirected. Pin the route to the https listener.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: sonarqube-sonarqube-http-route
            patch: |
              - op: add
                path: /spec/parentRefs/0/sectionName
                value: https
