apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-sonarqube
  namespace: sonarqube
spec:
  interval: 5m
  chart:
    spec:
      chart: postgresql
      version: "^18.x.x"
      sourceRef:
        kind: HelmRepository
        name: postgres-sonarqube
        namespace: sonarqube
  valuesFrom:
    - kind: ConfigMap
      name: postgres-sonarqube-values
      valuesKey: values.yaml