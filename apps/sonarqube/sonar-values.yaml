# 2.2Gi resident, and nothing depends on it. First to go.
priorityClassName: background

# The chart's init-sysctl initContainer runs privileged as root only to check that
# vm.max_map_count, fs.file-max and the nofile/nproc ulimits meet Elasticsearch's
# needs, raising them if not. The node already exceeds all four (its log only ever
# showed the comparisons), and vm.max_map_count is pinned on the host in
# config-install/99-sysctl-tuning.conf. Without it the namespace can enforce
# Pod Security `restricted`.
initSysctl:
  enabled: false

postgresql:
  enabled: false

## Override JDBC values
## for external Databases
jdbcOverwrite:
  enabled: true
  jdbcUrl: "jdbc:postgresql://postgres-sonarqube-postgresql.sonarqube.svc.cluster.local:5432/sonar"
  jdbcUsername: "sonar"
  jdbcSecretName: "sonarqube-postgres-secret"
  jdbcSecretPasswordKey: "password"  # Key on secret sonarqube-postgres-secret

# Passcode protecting /api/monitoring/metrics. Read from a SOPS-encrypted Secret
# rather than inlined here: this file is rendered into a ConfigMap, so any value
# set directly would sit in clear both in git and in the cluster.
# The chart requires BOTH keys, and stops generating its own passcode Secret as
# soon as they are set (see templates/secret.yaml and templates/validation.yaml).
monitoringPasscodeSecretName: "sonarqube-monitoring-passcode"
monitoringPasscodeSecretKey: "SONAR_WEB_SYSTEMPASSCODE"

community:
  enabled: true
  buildNumber: "26.9.0.129388"

resources:
  requests:
    memory: "2Gi"
    # 36m observed. The 3 CPU limit below is what matters during an analysis; the
    # request only reserved a core and a half of scheduling capacity.
    cpu: "200m"
  limits:
    memory: "3Gi"
    cpu: "3"

ingress:
  enabled: false

# For HTTPS with API gateway
httproute:
  enabled: true
  gateway: envoy-gateway
  gatewayNamespace: envoy-gateway-system
  hostnames:
    - sonarqube.kouidri.fr
