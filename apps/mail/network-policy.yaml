# NetworkPolicy: restrict ingress to mail protocols, allow outbound mail/DNS.
# Follows the pattern used by minecraft-server and wireguard-vpn.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stalwart-policy
  namespace: mail
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Stalwart mail listeners exposed via the LoadBalancer ServiceLB:
    # incoming traffic from the public internet (ports 25,465,587,993)
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 192.168.0.0/16
              - 172.16.0.0/12
        - ipBlock:
            cidr: ::/0
            except:
              - fc00::/7
      ports:
        - protocol: TCP
          port: 25
        - protocol: TCP
          port: 465
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 993
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 192.168.0.0/16
              - 172.16.0.0/12
        - ipBlock:
            cidr: ::/0
            except:
              - fc00::/7
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 25
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 587
