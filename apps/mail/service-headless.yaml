# Headless service: StatefulSet serviceName + internal HTTP/MGMT access.
# The management port (8080) is intentionally NOT exposed publicly; it is
# reached only via `kubectl port-forward` (admin bootstrap/config).
apiVersion: v1
kind: Service
metadata:
  name: stalwart-headless
  namespace: mail
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: mgmt
      port: 8080
      targetPort: mgmt
      protocol: TCP
