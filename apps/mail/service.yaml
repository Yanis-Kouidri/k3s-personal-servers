# L4 exposure for mail protocols only, via K3s native ServiceLB (klipper-lb),
# same mechanism already used by minecraft (25565) and wireguard (51820).
# The port 80/443 (Envoy) and 8080 (mgmt) are deliberately NOT bound here.
apiVersion: v1
kind: Service
metadata:
  name: stalwart
  namespace: mail
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
      protocol: TCP
    - name: smtps
      port: 465
      targetPort: smtps
      protocol: TCP
    - name: submission
      port: 587
      targetPort: submission
      protocol: TCP
    - name: imaps
      port: 993
      targetPort: imaps
      protocol: TCP
