apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  namespace: mail
spec:
  serviceName: stalwart
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      # None of this container's processes talk to the Kubernetes API, so the
      # ServiceAccount token has no reason to be mounted. Leaving it in place
      # hands a foothold to anything that manages to run code in here.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v0.16.21
          imagePullPolicy: IfNotPresent
          # The image already runs as 2000 (checked with `id` in the pod); pinning it
          # here makes that a guarantee rather than a coincidence.
          #
          # NET_BIND_SERVICE is not negotiable: the binary carries
          # `cap_net_bind_service=ep` as a FILE capability, so the kernel refuses to
          # execve it at all unless that capability is in the bounding set --
          # "exec /usr/local/bin/stalwart: operation not permitted", before a single
          # line of the program runs. It also genuinely needs it, to bind 25/465/587/993
          # as uid 2000.
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          args:
            - "--config"
            - "/etc/stalwart/config.json"

          ports:
            - name: smtp
              containerPort: 25
              protocol: TCP
            - name: submissions
              containerPort: 465
              protocol: TCP
            - name: submission
              containerPort: 587
              protocol: TCP
            - name: imaps
              containerPort: 993
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP

          # exec rather than httpGet, and that is not a style choice. The 8080
          # listener expects PROXY protocol v2 -- see the BackendTrafficPolicy in
          # infra/networking/gateway-config -- so Envoy prefixes every request with a
          # proxy header. The kubelet does not, and Stalwart drops the connection:
          #     Proxy protocol error ... listenerId = "http", reason = "invalid proxy header"
          # which reaches the kubelet as `Get "http://10.42.0.63:8080/healthz/ready":
          # EOF` and restarts the pod. Stalwart exempts localhost from the proxy
          # requirement, so curl from inside the container is the one path that works.
          #
          # /healthz/ready and /healthz/live both answer 200 (/healthz alone is a 404).
          startupProbe:
            exec:
              command: ["curl", "-fsS", "-o", "/dev/null", "--max-time", "5",
                        "http://localhost:8080/healthz/ready"]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["curl", "-fsS", "-o", "/dev/null", "--max-time", "5",
                        "http://localhost:8080/healthz/ready"]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["curl", "-fsS", "-o", "/dev/null", "--max-time", "5",
                        "http://localhost:8080/healthz/live"]
            periodSeconds: 20
            failureThreshold: 5

          # Sized on what it actually uses: 53m CPU and 143Mi for a 37MB store.
          # Until now this pod had no limit at all, on a node whose memory is
          # already overcommitted -- an internet-facing mail server was the one
          # process able to take the whole node down.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: data
              mountPath: /var/lib/stalwart
            - name: config
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
            - name: tls
              mountPath: /etc/stalwart/tls
              readOnly: true

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stalwart-data
        - name: config
          configMap:
            name: stalwart-config
        - name: tls
          secret:
            secretName: kouidri-fr-tls
