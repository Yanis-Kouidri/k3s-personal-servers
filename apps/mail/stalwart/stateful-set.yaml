apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  namespace: mail
spec:
  serviceName: stalwart
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v0.16.18
          imagePullPolicy: IfNotPresent
          args:
          - "--config"
          - "/etc/stalwart/config.json"

          ports:
            - name: smtp
              containerPort: 25
              protocol: TCP
            - name: submissions
              containerPort: 465
              protocol: TCP
            - name: submission
              containerPort: 587
              protocol: TCP
            - name: imaps
              containerPort: 993
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP

          volumeMounts:
            - name: data
              mountPath: /var/lib/stalwart
            - name: config
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stalwart-data
        - name: config
          configMap:
            name: stalwart-config