# Initial Stalwart config.json.
# Per the official Kubernetes chart reference, only the DataStore is defined
# here; everything else (listeners, TLS, DKIM, domains, accounts) is managed
# in the Stalwart database after bootstrap (via WebUI / stalwart-cli).
apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-config
  namespace: mail
data:
  config.json: |
    {
      "@type": "RocksDb",
      "path": "/var/lib/stalwart"
    }
