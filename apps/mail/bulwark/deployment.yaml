apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulwark
  namespace: mail
  labels:
    app.kubernetes.io/name: bulwark
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bulwark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bulwark
    spec:
      priorityClassName: application-low
      # None of this container's processes talk to the Kubernetes API, so the
      # ServiceAccount token has no reason to be mounted. Leaving it in place
      # hands a foothold to anything that manages to run code in here.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bulwark
          image: ghcr.io/bulwarkmail/webmail:1.19.1@sha256:dcb6ef96e3b020fa30d8a161b94ea39431f4a21a97a663cbc980b515e894879b
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            # Next.js writes its image-optimizer cache to .next/cache at runtime (not
            # at startup: a read-only test pod served /_next/image but logged
            # "ENOENT: mkdir '/app/.next/cache/images'"), and Node buffers to /tmp.
            # Both get an emptyDir; the cache was already lost with the container.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: APP_NAME
              value: Kouidri Webmail
            - name: BULWARK_TELEMETRY
              value: "off"
            - name: TRUSTED_PROXY_DEPTH
              value: "1"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bulwark-data
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
