apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulwark
  namespace: mail
  labels:
    app.kubernetes.io/name: bulwark
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bulwark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bulwark
    spec:
      priorityClassName: application-low
      # None of this container's processes talk to the Kubernetes API, so the
      # ServiceAccount token has no reason to be mounted. Leaving it in place
      # hands a foothold to anything that manages to run code in here.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bulwark
          image: ghcr.io/bulwarkmail/webmail:1.9.2
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: APP_NAME
              value: Kouidri Webmail
            - name: BULWARK_TELEMETRY
              value: "off"
            - name: TRUSTED_PROXY_DEPTH
              value: "1"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bulwark-data
