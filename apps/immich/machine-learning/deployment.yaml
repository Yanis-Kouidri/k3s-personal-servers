apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: machine-learning-server
  name: machine-learning-server
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: machine-learning-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: machine-learning-server
    spec:
      priorityClassName: background
      # None of this container's processes talk to the Kubernetes API, so the
      # ServiceAccount token has no reason to be mounted. Leaving it in place
      # hands a foothold to anything that manages to run code in here.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # local-path volumes are plain host directories: the kubelet does not apply
      # fsGroup to them, so ownership has to be fixed by hand. The files were
      # written as root before the move to uid 1000 (2026-10-31), and a restore
      # done as root on the node would bring root-owned files back. This walks
      # /cache once (instant when it is already right) and chowns only if needed.
      # Root, but with only CHOWN and DAC_OVERRIDE (to enter 0700 directories),
      # both allowed by the namespace's baseline profile.
      initContainers:
        - name: fix-ownership
          image: ghcr.io/immich-app/immich-machine-learning:v3.3.5@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
          command:
            - sh
            - -c
            - |
              if [ -n "$(find /cache ! -uid 1000 -print -quit)" ]; then
                echo "fixing ownership of /cache"
                chown -R 1000:1000 /cache
              fi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
          volumeMounts:
            - name: modele-cache
              mountPath: /cache
      containers:
        - image: ghcr.io/immich-app/immich-machine-learning:v3.3.5@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
          name: machine-learning-server
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            # Models live in /cache (the volume); HOME=/tmp (onnxruntime and matplotlib
            # caches) is an emptyDir. Tested with the real cache mounted read-only:
            # /ping and a CLIP inference OK, no EROFS.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: immich-server-config
          env:
            # HOME is /root in the image, which uid 1000 cannot write. onnxruntime
            # drops a small state file under ~/.cache; /tmp keeps it writable.
            # Models stay in /cache (HF_HOME and the cache folder are set there).
            - name: HOME
              value: /tmp
          # /ping answers 200 with "pong" (checked in the pod). The image carries no
          # curl or wget, which is why these are httpGet: the kubelet performs the
          # request itself, so nothing has to exist inside the container.
          startupProbe:
            httpGet:
              path: /ping
              port: 3003
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: 3003
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: 3003
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: modele-cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "1Gi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "2"
      volumes:
        - name: modele-cache
          persistentVolumeClaim:
            claimName: machine-learning-server-pvc
        - name: tmp
          emptyDir: {}
