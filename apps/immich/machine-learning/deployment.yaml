apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: machine-learning-server
  name: machine-learning-server
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: machine-learning-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: machine-learning-server
    spec:
      # None of this container's processes talk to the Kubernetes API, so the
      # ServiceAccount token has no reason to be mounted. Leaving it in place
      # hands a foothold to anything that manages to run code in here.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/immich-app/immich-machine-learning:v3.1.0
          name: machine-learning-server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: immich-server-config
          volumeMounts:
            - name: modele-cache
              mountPath: /cache
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
      volumes:
        - name: modele-cache
          persistentVolumeClaim:
            claimName: machine-learning-server-pvc
