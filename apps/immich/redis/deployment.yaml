apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      priorityClassName: datastore
      # None of this container's processes talk to the Kubernetes API, so the
      # ServiceAccount token has no reason to be mounted. Leaving it in place
      # hands a foothold to anything that manages to run code in here.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: immich-redis
          image: docker.io/valkey/valkey:9.1.0-alpine3.23
          # Stays root: the entrypoint uses setpriv to drop to the valkey user, which
          # needs SETUID/SETGID. A plain `drop: ALL` gets
          # "setpriv: setresuid failed: Operation not permitted" and a crash loop.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SETUID
                - SETGID
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          # A readinessProbe matters here even though the liveness one existed: without
          # it the Service sends Immich to a valkey that is up but not yet answering,
          # which shows up as errors in the app rather than as a not-ready pod.
          startupProbe:
            exec:
              command: ["valkey-cli", "ping"]
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 20
            failureThreshold: 5
      restartPolicy: Always
