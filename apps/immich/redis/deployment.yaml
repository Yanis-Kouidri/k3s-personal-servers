apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      priorityClassName: datastore
      # None of this container's processes talk to the Kubernetes API, so the
      # ServiceAccount token has no reason to be mounted. Leaving it in place
      # hands a foothold to anything that manages to run code in here.
      automountServiceAccountToken: false
      # Started directly as the image's valkey user (999:1000): the entrypoint only
      # uses root to chown /data and setpriv down to that user, and skips both when
      # it is already non-root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: immich-redis
          image: docker.io/valkey/valkey:9.1.0-alpine3.23
          # No capability left. Valkey only writes its RDB snapshot to /data, an
          # emptyDir: a cache, it was already lost with the container before.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          # A readinessProbe matters here even though the liveness one existed: without
          # it the Service sends Immich to a valkey that is up but not yet answering,
          # which shows up as errors in the app rather than as a not-ready pod.
          startupProbe:
            exec:
              command: ["valkey-cli", "ping"]
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 20
            failureThreshold: 5
      restartPolicy: Always
      volumes:
        - name: data
          emptyDir: {}
