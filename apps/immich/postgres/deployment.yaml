apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-immich-db
  namespace: immich
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: immich-db
  template:
    metadata:
      labels:
        app: immich-db
    spec:
      priorityClassName: datastore
      # None of this container's processes talk to the Kubernetes API, so the
      # ServiceAccount token has no reason to be mounted. Leaving it in place
      # hands a foothold to anything that manages to run code in here.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3-pgvector0.8.1
          envFrom:
            - secretRef:
                name: immich-db-secret
            - configMapRef:
                name: immich-db-config
          # No `drop: ALL` here: the postgres entrypoint starts as root, chowns
          # PGDATA and re-execs as the postgres user, which needs CHOWN/FOWNER/SETUID/
          # SETGID. Dropping them stops the container starting. Moving to
          # runAsUser: 999 would fix that, but the data on this PVC is root-owned, so
          # it is a data migration rather than a manifest change.
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          # pg_isready is in the image and returns 0 here without arguments or
          # credentials (checked in the pod). The liveness thresholds are deliberately
          # slack -- 6 failures 30s apart -- because restarting a database that is
          # merely busy or replaying WAL makes things worse, not better.
          startupProbe:
            exec:
              command: ["pg_isready", "-q"]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-q"]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-q"]
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 5
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-immich-pvc
