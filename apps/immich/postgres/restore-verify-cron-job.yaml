# Weekly proof that this namespace's newest dump can actually be restored: a
# throwaway PostgreSQL inside the container, no Kubernetes API access, no network,
# the backup volume READ-ONLY. The design and the env variables are described in
# apps/components/postgres-backup/restore-verify.sh; a failed Job is reported to
# Telegram by the job-monitor CronJob.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-restore-verify
  namespace: immich
spec:
  # Weekly, staggered across the four (immich 04:00, n8n 04:30, sonarqube 05:00,
  # authentik 05:30) so they never restore at the same time -- they compete for
  # the same disk.
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # A hung run (stuck connection, lock wait) would otherwise hold the Job
      # forever, and with concurrencyPolicy: Forbid block every later run without
      # failing, so no alert. Past the deadline the Job fails with DeadlineExceeded
      # and job-monitor reports it.
      # Normally under a minute. 30 min leaves room for the databases to grow.
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: immich-restore-verify
        spec:
          priorityClassName: background
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verify
              # Same image as the database itself, which matters here: a stock
              # postgres cannot load a dump that recreates extensions it lacks.
              image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3-pgvector0.8.1
              securityContext:
                allowPrivilegeEscalation: false
                # The scratch cluster, its socket and its pid file all live in the
                # /scratch emptyDir; nothing else is written.
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              # The script is shared by every app: apps/components/postgres-backup/restore-verify.sh
              command:
                - /bin/sh
                - /scripts/restore-verify.sh
              env:
                - name: DUMP_FORMAT
                  value: "plain"
                # Production had 67 tables when this was written.
                - name: MIN_TABLES
                  value: "50"
                - name: NONEMPTY_TABLES
                  value: "asset"
                - name: PRELOAD_LIBRARIES
                  value: "vchord"
              resources:
                requests:
                  cpu: "200m"
                  memory: "256Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
                - name: backups
                  mountPath: /backups
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scratch
              emptyDir:
                sizeLimit: 4Gi
            - name: backups
              persistentVolumeClaim:
                claimName: backup-immich-pvc
                readOnly: true
            - name: scripts
              configMap:
                name: postgres-backup-scripts
