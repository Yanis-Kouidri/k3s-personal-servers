apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-db-backup
  namespace: immich
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  # A CronJob that misses more than 100 schedules (node down, cluster off for a few
  # days) stops scheduling altogether and never recovers on its own. This bounds how
  # far behind a missed run may start, so the counter never reaches that limit.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            # Selected by network-policies/network-policy-backup.yaml (egress to the DB)
            # and allowed as a source by network-policy-postgres.yaml -- keep both in sync.
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: postgres-backup
              image: postgres:18-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  DB_HOST=postgres
                  DATE="$(date +%Y-%m-%d_%H-%M-%S)"
                  BACKUP_FILE="/backups/immich_db_${DATE}.sql"

                  # A dump that dies midway (DB restarting, disk full) still leaves a
                  # truncated file behind, which the rotation below would happily count
                  # as a valid backup. Drop it unless the script reaches the end.
                  trap 'rm -f "$BACKUP_FILE"' EXIT

                  # k3s programs a new pod's NetworkPolicy rules slightly after the pod
                  # gets its IP, so the very first connection out of a freshly created
                  # backup pod is refused ("connection to server at ... failed:
                  # Connection refused"). Without this wait the first attempt always
                  # fails and only the OnFailure restart succeeds.
                  i=0
                  until pg_isready -h "$DB_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -q; do
                    i=$((i + 1))
                    if [ "$i" -ge 30 ]; then
                      echo "PostgreSQL unreachable at $DB_HOST after 60s, giving up" >&2
                      exit 1
                    fi
                    echo "waiting for PostgreSQL at $DB_HOST..."
                    sleep 2
                  done

                  echo "Starting Immich PostgreSQL backup..."
                  # --file= rather than a shell redirection: `> file` is opened by the
                  # shell *before* pg_dump runs, so a failing dump left an empty .sql
                  # behind while the job still exited 0.
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump \
                    -h postgres \
                    -U "$POSTGRES_USER" \
                    -d "$POSTGRES_DB" \
                    --file="$BACKUP_FILE"

                  trap - EXIT

                  # Only reached once the dump above succeeded: with `set -e` a failed
                  # pg_dump exits here and fails the Job, so the retention below can no
                  # longer delete good backups in the wake of a broken run.
                  find /backups -type f -mtime +7 -name "*.sql" -delete
                  echo "Backup completed: $BACKUP_FILE"
              env:
                # User and database come from the same ConfigMap the server itself reads,
                # so they cannot drift away from the running instance.
                - name: POSTGRES_USER
                  valueFrom:
                    configMapKeyRef:
                      name: immich-db-config
                      key: POSTGRES_USER
                - name: POSTGRES_DB
                  valueFrom:
                    configMapKeyRef:
                      name: immich-db-config
                      key: POSTGRES_DB
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-secret
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-immich-pvc
