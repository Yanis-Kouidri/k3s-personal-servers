apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: immich-server
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      priorityClassName: application
      # None of this container's processes talk to the Kubernetes API, so the
      # ServiceAccount token has no reason to be mounted. Leaving it in place
      # hands a foothold to anything that manages to run code in here.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # local-path volumes are plain host directories: the kubelet does not apply
      # fsGroup to them, so ownership has to be fixed by hand. The files were
      # written as root before the move to uid 1000 (2026-10-31), and a restore
      # done as root on the node would bring root-owned files back. This walks
      # /data once (instant when it is already right) and chowns only if needed.
      # Root, but with only CHOWN and DAC_OVERRIDE (to enter 0700 directories),
      # both allowed by the namespace's baseline profile.
      initContainers:
        - name: fix-ownership
          image: ghcr.io/immich-app/immich-server:v3.3.1
          command:
            - sh
            - -c
            - |
              if [ -n "$(find /data ! -uid 1000 -print -quit)" ]; then
                echo "fixing ownership of /data"
                chown -R 1000:1000 /data
              fi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
          volumeMounts:
            - name: server-storage
              mountPath: /data
      containers:
        - image: ghcr.io/immich-app/immich-server:v3.3.1
          name: immich-server
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: immich-server-config
          env:
            # ConfigMap
            - name: DB_DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: immich-db-config
                  key: POSTGRES_DB
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: immich-db-config
                  key: POSTGRES_USER
            # Secret
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-secret
                  key: POSTGRES_PASSWORD

          ports:
            - containerPort: 2283
              protocol: TCP
          # /api/server/ping answers 200 (checked in the pod; /api/health is a 404).
          # The startup budget is deliberately long: Immich runs its database
          # migrations before serving, and a liveness probe firing during that would
          # restart it into the same migration forever.
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: server-storage
              mountPath: /data
          resources:
            requests:
              # Sized on what it actually holds (~700Mi resident). At 256Mi it sat
              # permanently above its own request, which is what makes a pod the
              # first thing the kubelet evicts.
              memory: "768Mi"
              cpu: "100m"
            limits:
              # v3.2.2 OOMKilled in a loop at 2Gi (exit 137, 2026-09-27): after a
              # version change Immich re-processes the library, and this container
              # runs the API and the job workers together -- several exiftool
              # (perl) plus ffprobe at once, which the kernel OOM log named as it
              # killed the cgroup. 3.1.0 sat at ~700Mi resident; 3.2.2 needs more
              # than twice that under that burst. CPU went with it: it sat pegged
              # at its 1-core ceiling, which only made the jobs take longer to
              # drain. The node has 8 cores and ~12Gi genuinely free, and the
              # machine-learning pod already sits at 4Gi/2 cores.
              memory: "4Gi"
              cpu: "2"
      volumes:
        - name: server-storage
          persistentVolumeClaim:
            claimName: server-immich-pvc
