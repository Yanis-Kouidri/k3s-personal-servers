apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-website-v2
  namespace: personal-website-v2
spec:
  selector:
    matchLabels:
      app: personal-website-v2
  template:
    metadata:
      labels:
        app: personal-website-v2
    spec:
      containers:
        - name: personal-website-v2
          image: ghcr.io/yanis-kouidri/personal-website-v2:0.0.4
          imagePullPolicy: Always
          resources:
            limits:
              memory: "728Mi"
              cpu: "700m"
            requests:
              memory: "256Mi"
              cpu: "200m"
          
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1
