apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-website-v2
  namespace: personal-website-v2
spec:
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: personal-website-v2
  template:
    metadata:
      labels:
        app: personal-website-v2
    spec:
      # None of this container's processes talk to the Kubernetes API, so the
      # ServiceAccount token has no reason to be mounted. Leaving it in place
      # hands a foothold to anything that manages to run code in here.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: personal-website-v2
          image: ghcr.io/yanis-kouidri/personal-website-v2:THIS-TAG-DOES-NOT-EXIST
          # Pinned tag, so Always only meant a registry round-trip on every restart
          # -- and no restart at all whenever ghcr.io was unreachable.
          imagePullPolicy: IfNotPresent
          # Already runs as 1000. runAsGroup is left alone: the image runs with gid 0.
          #
          # NET_BIND_SERVICE is needed even though Caddy only listens on 8080 here: the
          # binary carries `cap_net_bind_service=ep` as a file capability, and the
          # kernel refuses to execve such a binary when the capability is missing from
          # the bounding set. Verified: with `drop: ALL` alone the container dies on
          # "exec /usr/bin/caddy: operation not permitted".
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          resources:
            limits:
              memory: "728Mi"
              cpu: "700m"
            requests:
              memory: "256Mi"
              cpu: "200m"

          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1
