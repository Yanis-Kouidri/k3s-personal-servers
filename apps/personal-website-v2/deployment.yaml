apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-website-v2
  namespace: personal-website-v2
spec:
  selector:
    matchLabels:
      app: personal-website-v2
  template:
    metadata:
      labels:
        app: personal-website-v2
    spec:
      containers:
        - name: personal-website-v2
          image: ghcr.io/yanis-kouidri/personal-website-v2:0.0.2
          imagePullPolicy: Always
          resources:
            limits:
              memory: "728Mi"
              cpu: "700m"
            requests:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
