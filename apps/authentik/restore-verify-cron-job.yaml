# Weekly proof that this namespace's newest dump can actually be restored: a
# throwaway PostgreSQL inside the container, no Kubernetes API access, no network,
# the backup volume READ-ONLY. The design and the env variables are described in
# apps/components/postgres-backup/restore-verify.sh; a failed Job is reported to
# Telegram by the job-monitor CronJob.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-restore-verify
  namespace: authentik
spec:
  # Staggered after sonarqube-restore-verify (05:00): they compete for the same disk.
  schedule: "30 5 * * 0"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # A hung run (stuck connection, lock wait) would otherwise hold the Job
      # forever, and with concurrencyPolicy: Forbid block every later run without
      # failing, so no alert. Past the deadline the Job fails with DeadlineExceeded
      # and job-monitor reports it.
      # Normally under a minute. 30 min leaves room for the databases to grow.
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: authentik-restore-verify
        spec:
          priorityClassName: background
          restartPolicy: Never
          automountServiceAccountToken: false
          # initdb refuses to run as root. uid 70 is postgres in the alpine image.
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verify
              # Same major as the server, as in backup-cron-job.yaml.
              image: postgres:17.11-alpine
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              # The script is shared by every app: apps/components/postgres-backup/restore-verify.sh
              command:
                - /bin/sh
                - /scripts/restore-verify.sh
              env:
                - name: DUMP_FORMAT
                  value: "custom"
                # Production had 230 tables, 4 users and 15 flows when this was written.
                - name: MIN_TABLES
                  value: "150"
                - name: NONEMPTY_TABLES
                  value: "authentik_core_user authentik_flows_flow"
              resources:
                requests:
                  cpu: "200m"
                  memory: "256Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
                - name: backups
                  mountPath: /backups
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scratch
              emptyDir:
                sizeLimit: 2Gi
            - name: backups
              persistentVolumeClaim:
                claimName: backup-authentik-pvc
                readOnly: true
            - name: scripts
              configMap:
                name: postgres-backup-scripts
