global:
  # Covers the server and worker deployments; both default to global.
  priorityClassName: platform-auth
  # Pod-level security context, merged by the chart into both server and worker.
  # The chart ships them empty: the image already runs as uid 1000, but nothing
  # stopped a privilege escalation and the pods kept the default capabilities.
  # With the container contexts below, both pods pass the `restricted` profile.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

authentik:
  existingSecret:
    secretName: authentik-config
  error_reporting:
    enabled: false

server:
  replicas: 1
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # 524Mi observed against a 512Mi request: it lived just above its own request,
  # which is what marks a pod for eviction first.
  podAnnotations:
    checksum/authentik-config: "ab5008401c8012426db8f800e8457a5529d233f2d02f41286e71d5a5547a418a"
  resources:
    requests:
      cpu: 100m
      memory: 640Mi
    limits:
      memory: 1Gi

worker:
  replicas: 1
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podAnnotations:
    checksum/authentik-config: "ab5008401c8012426db8f800e8457a5529d233f2d02f41286e71d5a5547a418a"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

postgresql:
  enabled: true
  auth:
    existingSecret: authentik-postgresql-credentials
    secretKeys:
      userPasswordKey: password
  primary:
    # The subchart does not inherit the global above.
    priorityClassName: platform-auth
    # Was BestEffort: the chart's "nano" preset is not applied here, so the pod
    # had no requests at all and sat at the top of the OOM list while holding the
    # credentials database for every service behind the SSO.
    resourcesPreset: ""
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        memory: 512Mi
    persistence:
      enabled: true
      size: 10Gi
    networkPolicy:
      enabled: false
