global:
  # Covers the server and worker deployments; both default to global.
  priorityClassName: platform-auth
  # Pod-level security context, merged by the chart into both server and worker.
  # The chart ships them empty: the image already runs as uid 1000, but nothing
  # stopped a privilege escalation and the pods kept the default capabilities.
  # With the container contexts below, both pods pass the `restricted` profile.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  # Plain settings go here, not under `authentik:`: with existingSecret the chart
  # renders none of that block, so its values never reached the pods.
  env:
    - name: AUTHENTIK_ERROR_REPORTING__ENABLED
      value: "false"
    # The hourly check to version.goauthentik.io only failed: the worker has no
    # Internet egress, and Renovate already tracks new releases.
    - name: AUTHENTIK_DISABLE_UPDATE_CHECK
      value: "true"

authentik:
  existingSecret:
    secretName: authentik-config

# No Kubernetes API access. The chart's ServiceAccount, Role (create/delete
# Secrets and Deployments in the namespace) and ClusterRole only serve outposts
# that authentik deploys itself; the embedded outpost needs none of it. Without a
# token, authentik no longer creates its "Local Kubernetes Cluster" connection,
# whose health check hit the API (blocked by the NetworkPolicy) every few minutes.
# Re-enable all three (and an egress to the node on 6443) for a managed LDAP or
# RADIUS outpost.
serviceAccount:
  create: false

server:
  replicas: 1
  serviceAccountName: default
  automountServiceAccountToken: false
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # 524Mi observed against a 512Mi request: it lived just above its own request,
  # which is what marks a pod for eviction first.
  podAnnotations:
    checksum/authentik-config: "ab5008401c8012426db8f800e8457a5529d233f2d02f41286e71d5a5547a418a"
  resources:
    requests:
      cpu: 100m
      memory: 640Mi
    limits:
      memory: 1Gi

worker:
  replicas: 1
  serviceAccountName: default
  automountServiceAccountToken: false
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podAnnotations:
    checksum/authentik-config: "ab5008401c8012426db8f800e8457a5529d233f2d02f41286e71d5a5547a418a"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

postgresql:
  enabled: true
  auth:
    existingSecret: authentik-postgresql-credentials
    secretKeys:
      userPasswordKey: password
  primary:
    # The subchart does not inherit the global above.
    priorityClassName: platform-auth
    # Was BestEffort: the chart's "nano" preset is not applied here, so the pod
    # had no requests at all and sat at the top of the OOM list while holding the
    # credentials database for every service behind the SSO.
    resourcesPreset: ""
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        memory: 512Mi
    persistence:
      enabled: true
      size: 10Gi
    networkPolicy:
      enabled: false
