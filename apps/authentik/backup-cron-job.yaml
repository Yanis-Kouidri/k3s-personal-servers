apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-db-backup
  namespace: authentik
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  # A CronJob that misses more than 100 schedules (node down, cluster off for a few
  # days) stops scheduling altogether and never recovers on its own. This bounds how
  # far behind a missed run may start, so the counter never reaches that limit.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # A hung run (stuck connection, lock wait) would otherwise hold the Job
      # forever, and with concurrencyPolicy: Forbid block every later run without
      # failing, so no alert. Past the deadline the Job fails with DeadlineExceeded
      # and job-monitor reports it.
      # Normally under 20s. 15 min still covers the 60s DB wait, the OnFailure
      # retries (the deadline counts all of them) and a lot of database growth.
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            # Selected by network-policies/network-policy-backup.yaml (egress to the DB)
            # and allowed as a source by network-policy-postgresql.yaml -- keep both in sync.
            app: authentik-db-backup
        spec:
          priorityClassName: background
          # None of this container's processes talk to the Kubernetes API, so the
          # ServiceAccount token has no reason to be mounted.
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          # Unlike the older backup PVCs, this one never held root-owned dumps, so
          # the job can run as the image's own postgres user (uid 70 on alpine).
          # local-path creates the volume directory world-writable.
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: postgres-backup
              # Same major as the server (postgres 17, from the authentik chart). A
              # newer pg_dump would still read the server, but its archive format
              # can be too new for the pg_restore 17 that a real restore into the
              # production database would use. Bump together with the server.
              image: postgres:17.11-alpine
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              # The script is shared by every app: apps/components/postgres-backup/backup.sh
              command:
                - /bin/sh
                - /scripts/backup.sh
              env:
                - name: DB_HOST
                  value: "authentik-postgresql"
                - name: DUMP_PREFIX
                  value: "authentik"
                # Custom format: compressed, and restorable with pg_restore --no-owner
                # into a database whose roles differ from production.
                - name: DUMP_FORMAT
                  value: "custom"
                # Must match the postgresql subchart's defaults in values.yaml.
                - name: POSTGRES_USER
                  value: authentik
                - name: POSTGRES_DB
                  value: authentik
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: authentik-postgresql-credentials
                      key: password
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-authentik-pvc
            - name: scripts
              configMap:
                name: postgres-backup-scripts
