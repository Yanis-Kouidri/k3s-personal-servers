apiVersion: v1
kind: Namespace
metadata:
  name: goatcounter
  labels:
    # Pod Security Admission. The single pod here meets `restricted` (non-root,
    # no capabilities, RuntimeDefault seccomp), so it is enforced directly rather
    # than sitting at `baseline` like the older namespaces.
    #
    # enforce-version is pinned so upgrading k3s cannot silently tighten the rules
    # and leave pods unable to start; bump it deliberately after a cluster upgrade.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
