# GoatCounter picks the client address from Cf-Connecting-Ip, Fly-Client-Ip,
# X-Azure-Socketip or X-Real-Ip before X-Forwarded-For. Envoy passes those through
# untouched, so any visitor could pick the country they are counted in: they are
# dropped on every route. X-Forwarded-For itself is safe, GoatCounter reads its
# right-most public entry, which is the one Envoy appends.
#
# Dashboard and collection endpoint
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goatcounter-stats-kouidri-fr
  namespace: goatcounter
spec:
  hostnames:
    - stats.kouidri.fr
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - name: goatcounter
          port: 80
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Cf-Connecting-Ip
              - Fly-Client-Ip
              - X-Azure-Socketip
              - X-Real-Ip
      matches:
        - path:
            type: PathPrefix
            value: /
---
# Same collection endpoint, first-party: https://www.kouidri.fr/count. The site
# keeps its CSP on 'self' and content blockers do not see a stats domain.
# GoatCounter finds the site from the Host header, hence the rewrite to the vhost
# the site is registered under.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goatcounter-www-kouidri-fr-count
  namespace: goatcounter
spec:
  hostnames:
    - www.kouidri.fr
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - name: goatcounter
          port: 80
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: stats.kouidri.fr
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Cf-Connecting-Ip
              - Fly-Client-Ip
              - X-Azure-Socketip
              - X-Real-Ip
      matches:
        - path:
            type: Exact
            value: /count
