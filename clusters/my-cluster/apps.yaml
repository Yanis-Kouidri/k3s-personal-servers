apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps
  prune: true
  # wait: true makes this Kustomization report Ready only once every resource it
  # applied is actually Ready, not merely applied. Two things follow from that:
  # dependsOn below becomes a real ordering guarantee instead of "the manifests
  # landed", and a HelmRelease or Deployment that never comes up now fails its
  # parent Kustomization -- which is what reaches Telegram.
  #
  # retryInterval is 5m rather than the default (= interval): fast enough to
  # recover from a transient failure, slow enough not to re-alert every couple of
  # minutes, since the notification-controller only de-duplicates over 5 minutes.
  wait: true
  timeout: 15m
  retryInterval: 5m
  #
  # One consequence to know about: local-path binds with WaitForFirstConsumer, so a
  # PVC nothing mounts yet stays Pending and would hold this Kustomization
  # not-Ready until its timeout. Every PVC here is currently Bound; a new one added
  # for a CronJob will only bind the first time that job runs.
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: infra
