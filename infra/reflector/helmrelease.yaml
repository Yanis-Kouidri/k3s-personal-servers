apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: reflector
      version: "10.0.65"
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: flux-system
  values:
    # Replicates the TLS secret into the mail namespace; without it Stalwart
    # eventually serves an expired certificate.
    priorityClassName: platform-critical
