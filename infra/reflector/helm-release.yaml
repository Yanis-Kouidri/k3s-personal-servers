apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: reflector
      version: "10.0.65"
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: flux-system
  values:
    # Replicates the TLS secret into the mail namespace; without it Stalwart
    # eventually serves an expired certificate.
    priorityClassName: platform-critical
    # Was BestEffort, so first in line for the OOM killer despite carrying the
    # highest priority class. 188Mi resident is a lot for what it does, but that
    # is what it uses.
    resources:
      requests:
        cpu: 10m
        memory: 192Mi
      limits:
        memory: 384Mi
