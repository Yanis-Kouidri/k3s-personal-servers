# Temporary and read-only: SSH still refuses the key after the fix Job, and nobody
# can read the cluster or the host. Sends to Telegram what is needed to understand
# why: the fix Jobs' logs, the ownership of the paths sshd checks, and sshd's own
# messages in auth.log.
apiVersion: batch/v1
kind: Job
metadata:
  name: host-diag-1
  namespace: kube-system
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: host-diag
      containers:
        - name: diag
          # Already on the node (job-monitor runs it every 15 min).
          image: alpine/k8s:1.37.1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -u
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              k() {
                kubectl --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" \
                        --token="$(cat "$SA/token")" \
                        --certificate-authority="$SA/ca.crt" "$@"
              }
              i=0
              until TOKEN=$(k get secret telegram-token -n monitoring -o jsonpath='{.data.token}' --request-timeout=5s 2>/dev/null | base64 -d) && [ -n "$TOKEN" ]; do
                i=$((i + 1)); [ "$i" -ge 30 ] && { echo "cannot read the token" >&2; exit 1; }
                sleep 2
              done
              send() {
                # Telegram caps a message at 4096 characters.
                printf '%s\n%s' "$1" "$(cat)" | head -c 3900 > /tmp/msg
                curl -sS --fail-with-body --max-time 20 \
                  -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
                  --data-urlencode "chat_id=-5011079279" \
                  --data-urlencode "text@/tmp/msg" >/dev/null
              }

              {
                k get jobs -n kube-system -o wide 2>&1
                k get pods -n kube-system -l batch.kubernetes.io/job-name -o wide 2>&1
                for j in fix-root-permissions fix-root-permissions-2; do
                  echo "--- logs $j"
                  k logs -n kube-system "job/$j" --tail=60 2>&1
                done
              } | send "🩺 host-diag 1/3: fix jobs"

              {
                grep -E 'sshd|sudo' /host/var/log/auth.log 2>&1 | grep -v CRON | tail -25
              } | send "🩺 host-diag 2/3: auth.log"

              {
                for p in / /home /home/ubuntu /home/ubuntu/.ssh /home/ubuntu/.ssh/authorized_keys \
                         /etc /etc/ssh /usr /usr/bin /usr/bin/sudo /var /var/log /tmp /run; do
                  stat -c '%a %u:%g %n' "/host$p" 2>&1
                done
                echo "--- uid 101 entries (first 10 per tree)"
                for t in etc usr/bin usr/sbin home root var/log; do
                  echo "$t: $(find "/host/$t" -xdev -uid 101 2>/dev/null | head -10 | tr '\n' ' ')"
                done
              } | send "🩺 host-diag 3/3: paths"

          volumeMounts:
            - name: host
              mountPath: /host
              readOnly: true
      volumes:
        - name: host
          hostPath:
            path: /
            type: Directory
