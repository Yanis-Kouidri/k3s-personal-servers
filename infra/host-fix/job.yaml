# Temporary: restores / after `cp -a` copied the Tor volume's ownership (101:102,
# 0700) onto it on 2026-11-01. Remove this folder once the Job has completed.
apiVersion: batch/v1
kind: Job
metadata:
  name: fix-root-permissions
  namespace: kube-system
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: fix
          image: busybox:1.37.0
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -eu
              echo "== before"
              ls -lan /host
              # A few paths that a recursive chown/chmod would have touched too.
              ls -ldn /host/etc /host/usr /host/usr/bin/sudo /host/home /host/home/ubuntu || true
              chown 0:0 /host
              chmod 0755 /host
              # Only what the copy put there: the Tor volume's entries, owned by uid 101.
              for f in cached-certs cached-microdesc-consensus cached-microdescs cached-microdescs.new hidden_service keys lock state; do
                if [ -e "/host/$f" ] && [ "$(stat -c %u "/host/$f")" = 101 ]; then
                  rm -rf "/host/$f" && echo "removed /$f"
                fi
              done
              echo "== after"
              ls -lan /host
              echo "== entries still owned by uid 101"
              find /host -mindepth 1 -maxdepth 1 -uid 101
          volumeMounts:
            - name: host
              mountPath: /host
      volumes:
        - name: host
          hostPath:
            path: /
            type: Directory
