apiVersion: apps/v1
kind: Deployment
metadata:
  name: tor-daemon
  namespace: tor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tor-daemon
  template:
    metadata:
      labels:
        app: tor-daemon
    spec:
      priorityClassName: application
      # None of this container's processes talk to the Kubernetes API, so the
      # ServiceAccount token has no reason to be mounted. Leaving it in place
      # hands a foothold to anything that manages to run code in here.
      automountServiceAccountToken: false
      # The image's tor user (101:102), which owns everything on the volume. The
      # image's entrypoint is bypassed (see `command`): it only ran as root to chown
      # the volume, write a default torrc and su-exec down to that same user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 102
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        # Refuses to start Tor without the onion key. On an empty volume (lost PVC,
        # restore gone wrong) Tor would otherwise create a brand-new key and publish
        # a different .onion address without a word. To restore, see README.md.
        - name: require-onion-key
          image: dockurr/tor:0.4.9.14
          command:
            - sh
            - -c
            - |
              until [ -s /var/lib/tor/hidden_service/hs_ed25519_secret_key ]; do
                echo "no onion key in /var/lib/tor/hidden_service, waiting (see infra/tor/README.md)"
                sleep 30
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tor-data
              mountPath: /var/lib/tor
              readOnly: true
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              memory: "32Mi"

      containers:
        - name: tor
          image: dockurr/tor:0.4.9.14
          # torrc (tor-config) carries every setting the entrypoint used to add.
          command: ["tor", "-f", "/etc/tor/torrc"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # No HTTP endpoint, and SocksPort is bound to 127.0.0.1, so a tcpSocket
          # probe from the kubelet could never reach it -- hence exec. `nc` is present
          # in this image (checked).
          startupProbe:
            exec:
              command: ["nc", "-z", "127.0.0.1", "9050"]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["nc", "-z", "127.0.0.1", "9050"]
            periodSeconds: 20
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["nc", "-z", "127.0.0.1", "9050"]
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: tor-config
              mountPath: /etc/tor
            - name: tor-data
              mountPath: /var/lib/tor
          resources:
            requests:
              cpu: "50m"
              memory: "160Mi"
            limits:
              cpu: "200m"
              # Raised along with the request above it: tor holds ~112Mi, so a
              # 128Mi ceiling left it no room at all -- and a request may not
              # exceed its own limit, which is what the API server rejected.
              memory: "320Mi"

      volumes:
        - name: tor-config
          configMap:
            name: tor-config
        - name: tor-data
          persistentVolumeClaim:
            claimName: tor-hostname-data
