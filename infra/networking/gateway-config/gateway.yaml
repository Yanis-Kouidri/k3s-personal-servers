# EnvoyProxy
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-gateway-dualstack
  namespace: envoy-gateway-system
spec:
  ipFamily: DualStack
  # The proxy pods carry every HTTP request into the cluster, so they sit in the
  # same tier as the control plane. They are created by the Envoy Gateway
  # controller rather than by its chart, which is why this is set here.
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          priorityClassName: platform-critical
        # Envoy Gateway defaults to a 512Mi request and no limit at all, so a leak
        # or a flood of connections could grow the proxy until the node itself is
        # short of memory. Peak measured over ~43h (cgroup memory.peak, 2026-10-31):
        # envoy 110Mi, shutdown-manager 24Mi. Requests at ~2x that, limits with
        # wide headroom for traffic bursts and config reloads.
        container:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
        # The shutdown-manager sidecar has no field of its own in EnvoyProxy; the
        # strategic-merge patch on the rendered Deployment is the supported way in.
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: shutdown-manager
                      resources:
                        requests:
                          cpu: 10m
                          memory: 32Mi
                        limits:
                          memory: 128Mi
---
# GatewayClass
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy-gateway-dualstack
    namespace: envoy-gateway-system
---
# Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All

    - name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: kouidri-fr-tls
      allowedRoutes:
        namespaces:
          from: All
---
# Redirection HTTP -> HTTPS for all HTTP listners
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-filter-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Redirection https://kouidri.me -> https://kouidri.fr
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kouidri-me-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: envoy-gateway
      sectionName: https
      namespace: envoy-gateway-system
  hostnames:
    - "kouidri.me"
    - "www.kouidri.me"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: kouidri.fr
            statusCode: 301
