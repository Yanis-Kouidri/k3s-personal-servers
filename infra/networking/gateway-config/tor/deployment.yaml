apiVersion: apps/v1
kind: Deployment
metadata:
  name: tor-daemon
  namespace: envoy-gateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tor-daemon
  template:
    metadata:
      labels:
        app: tor-daemon
    spec:
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: fix-permissions
          image: alpine:latest
          command:
            [
              "sh",
              "-c",
              "chown -R 101:101 /var/lib/tor && chmod -R 700 /var/lib/tor",
            ]
          volumeMounts:
            - name: tor-data
              mountPath: /var/lib/tor

      containers:
        - name: tor
          image: dperson/torproxy@sha256:d161ddddd47b4d2a91b8fe93d61e81b0760c0452ab6983a35ed37452e24004f6
          command: ["/usr/bin/tor"]
          args:
            - "-f"
            - "/etc/tor/torrc"
          volumeMounts:
            - name: tor-config
              mountPath: /etc/tor/torrc
              subPath: torrc
            - name: tor-data
              mountPath: /var/lib/tor
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

      volumes:
        - name: tor-config
          configMap:
            name: tor-config
        - name: tor-data
          persistentVolumeClaim:
            claimName: tor-hostname-data
