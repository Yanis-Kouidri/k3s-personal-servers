apiVersion: apps/v1
kind: Deployment
metadata:
  name: tor-daemon
  namespace: envoy-gateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tor-daemon
  template:
    metadata:
      labels:
        app: tor-daemon
    spec:
      priorityClassName: application
      # None of this container's processes talk to the Kubernetes API, so the
      # ServiceAccount token has no reason to be mounted. Leaving it in place
      # hands a foothold to anything that manages to run code in here.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: tor
          image: dockurr/tor:0.4.9.12
          # Five capabilities instead of the ~14 a container gets by default, each one
          # established by testing the image rather than guessed:
          #   CHOWN, FOWNER  the entrypoint runs `install` on /var/lib/tor
          #   SETUID, SETGID it then uses su-exec; without them the container dies on
          #                  "su-exec: setgroups: Operation not permitted"
          #   DAC_OVERRIDE   the process runs as root but every file on the volume is
          #                  owned by syslog with mode 0600/0700 -- including
          #                  hs_ed25519_secret_key and hostname, which ARE the onion
          #                  identity. Without it root cannot read them.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
                - SETUID
                - SETGID
          # No HTTP endpoint, and SocksPort is bound to 127.0.0.1, so a tcpSocket
          # probe from the kubelet could never reach it -- hence exec. `nc` is present
          # in this image (checked).
          startupProbe:
            exec:
              command: ["nc", "-z", "127.0.0.1", "9050"]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["nc", "-z", "127.0.0.1", "9050"]
            periodSeconds: 20
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["nc", "-z", "127.0.0.1", "9050"]
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: tor-config
              mountPath: /etc/tor
            - name: tor-data
              mountPath: /var/lib/tor
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

      volumes:
        - name: tor-config
          configMap:
            name: tor-config
        - name: tor-data
          persistentVolumeClaim:
            claimName: tor-hostname-data
