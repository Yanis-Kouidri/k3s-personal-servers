apiVersion: apps/v1
kind: Deployment
metadata:
  name: tor-daemon
  namespace: envoy-gateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tor-daemon
  template:
    metadata:
      labels:
        app: tor-daemon
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: tor
          image: dockurr/tor:0.4.9.12
          # Binds only unprivileged ports (SocksPort 9050, HTTPTunnelPort 8118), so it
          # needs no capability at all.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tor-config
              mountPath: /etc/tor
            - name: tor-data
              mountPath: /var/lib/tor
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

      volumes:
        - name: tor-config
          configMap:
            name: tor-config
        - name: tor-data
          persistentVolumeClaim:
            claimName: tor-hostname-data
