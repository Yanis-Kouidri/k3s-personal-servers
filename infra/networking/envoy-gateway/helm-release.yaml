apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 30m
  releaseName: envoy-gateway

  chartRef:
    kind: OCIRepository
    name: gateway-helm

  install:
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3

  # This only covers the control plane. The Envoy proxy pods are created by the
  # controller from the EnvoyProxy resource, not by this chart, so their class is
  # set there -- see infra/networking/gateway-config/gateway.yaml.
  values:
    deployment:
      priorityClassName: platform-critical
