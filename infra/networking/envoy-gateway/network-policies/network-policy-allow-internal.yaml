apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal
  namespace: envoy-gateway-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # Allow all traffic within the namespace (controller <-> proxy communication)
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
