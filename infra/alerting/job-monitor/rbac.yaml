apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-monitor
  namespace: monitoring
automountServiceAccountToken: true
---
# Cluster-wide on purpose: the point is to catch a failing Job anywhere, including in
# namespaces that do not exist yet. Read-only, plus `patch` on jobs -- the CronJob marks
# a Job it has reported with an annotation, which is what stops it alerting twice.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-monitor
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: job-monitor
subjects:
  - kind: ServiceAccount
    name: job-monitor
    namespace: monitoring
