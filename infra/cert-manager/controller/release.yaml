apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  releaseName: cert-manager
  targetNamespace: cert-manager

  chart:
    spec:
      chart: cert-manager
      version: "v1.21.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
      interval: 12h

  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3

  values:
    # Covers the controller, webhook and cainjector.
    global:
      priorityClassName: platform-critical
    # Without these the three cert-manager pods are BestEffort, which sets their
    # oom_score_adj to 1000 -- the kernel kills them before anything else, while
    # platform-critical above says they should outlive everything. Highest
    # scheduling priority and lowest survival is a contradiction, not a policy.
    # Sized from observed use: controller 25Mi, webhook 11Mi, cainjector 23Mi.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          # The cainjector watches and caches CA material cluster-wide, so it has
          # more room to grow than its 23Mi at rest suggests.
          memory: 512Mi
    crds:
      enabled: true
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      enableGatewayAPI: true
