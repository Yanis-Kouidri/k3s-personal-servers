apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-kubernetes-api
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Must target the node's real API endpoint (`kubectl get endpoints kubernetes`) and
    # not the 10.43.0.1:443 ClusterIP: k3s' network policy controller evaluates egress
    # rules after the service DNAT, so a ClusterIP-based rule never matches and the
    # controller/cainjector crash-loop on "dial tcp 10.43.0.1:443: connect: connection
    # refused".
    - to:
        - ipBlock:
            cidr: 91.134.243.146/32
      ports:
        - protocol: TCP
          port: 6443
